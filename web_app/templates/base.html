<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Resume Builder · norangio{% endblock %}</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <meta name="color-scheme" content="dark">
    <meta name="theme-color" content="#060a10">
    <!-- Shared norangio theme: single source of truth for type and tokens. -->
    <link rel="stylesheet" href="https://norangio.dev/shared/v1/theme.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
    <style>
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

        /* Navy palette matching norangio.dev and the hub. The shared theme
           (linked above) supplies type and the canonical tokens; colours are
           overridden here. Dark only, like the homepage and hub. */
        :root {
            --bg-base: #060a10;
            --bg-surface: #0a0f17;
            --bg-surface-hover: #111926;
            --bg-subtle: #060a10;
            --border: #1c2738;
            --border-strong: #26344a;
            --border-subtle: #111926;
            --text-primary: #e6edf6;
            --text-secondary: #b8c4d4;
            --text-muted: #8595ab;
            --text-faint: #5b6b83;
            --accent: #9fd4ff;
            --accent-soft: rgba(74, 168, 255, 0.14);
            --action: #4aa8ff;
            --action-hover: #6bb8ff;
            --on-action: #060a10;
            --positive: #5ef0d2;
            --warning: #fbbf24;
            --danger: #f87171;
            --positive-bg: rgba(94, 240, 210, 0.08);
            --positive-border: rgba(94, 240, 210, 0.3);
            --positive-text: #5ef0d2;
            --warning-bg: rgba(251, 191, 36, 0.08);
            --warning-border: rgba(251, 191, 36, 0.3);
            --warning-text: #fcd34d;
            --danger-bg: rgba(248, 113, 113, 0.08);
            --danger-border: rgba(248, 113, 113, 0.35);
            --danger-text: #fca5a5;
            --radius: 0;
            --radius-sm: 0;
        }

        body {
            font-family: var(--font);
            font-size: 15px;
            line-height: 1.5;
            color: var(--text-primary);
            background: var(--bg-base);
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
        }

        .mono { font-family: var(--font-mono); font-feature-settings: 'tnum'; }

        /* ─── Brand header ─── */
        .topbar {
            background: var(--bg-surface);
            border-bottom: 1px solid var(--border);
        }

        .topbar-inner {
            max-width: 720px;
            margin: 0 auto;
            padding: 0 32px;
            height: 64px;
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .brand-mark {
            width: 32px;
            height: 32px;
            border-radius: var(--radius-sm);
            background: var(--action);
            color: var(--bg-base);
            display: inline-flex;
            align-items: center;
            justify-content: center;
            font-weight: 700;
            font-size: 12px;
            text-decoration: none;
            flex-shrink: 0;
        }

        .brand-name {
            font-size: 15px;
            font-weight: 600;
            color: var(--text-primary);
            text-decoration: none;
        }

        .brand-slash { color: var(--border-strong); }
        .brand-app { font-size: 14px; color: var(--text-muted); }

        .nav-links {
            margin-left: auto;
            display: flex;
            align-items: center;
            gap: 4px;
        }

        .nav-links a {
            font-size: 13px;
            font-weight: 500;
            color: var(--text-muted);
            text-decoration: none;
            padding: 6px 10px;
            white-space: nowrap;
            transition: color 0.15s, background 0.15s;
        }

        .nav-links a:hover {
            color: var(--text-primary);
            background: var(--bg-surface-hover);
        }

        .nav-links a.active {
            color: var(--accent);
            background: var(--accent-soft);
        }

        /* ─── Main ─── */
        main {
            max-width: 720px;
            margin: 0 auto;
            padding: 40px 32px 80px;
        }

        h1 {
            font-size: 28px;
            font-weight: 700;
            letter-spacing: -0.02em;
            color: var(--text-primary);
            margin-bottom: 20px;
        }

        h2 {
            font-size: 11px;
            font-weight: 600;
            letter-spacing: 0.18em;
            text-transform: uppercase;
            color: var(--text-muted);
            margin: 28px 0 10px;
        }

        p { color: var(--text-secondary); }

        a { color: var(--accent); }

        .card {
            background: var(--bg-surface);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            padding: 24px;
            margin-bottom: 16px;
        }

        label {
            display: block;
            font-size: 11px;
            font-weight: 600;
            letter-spacing: 0.06em;
            text-transform: uppercase;
            margin-bottom: 6px;
            color: var(--text-muted);
        }

        input[type="text"],
        input[type="email"],
        input[type="tel"],
        input[type="password"],
        textarea {
            width: 100%;
            font-size: 15px; /* prevents iOS zoom */
            padding: 10px 12px;
            border: 1px solid var(--border);
            border-radius: var(--radius-sm);
            margin-bottom: 12px;
            font-family: inherit;
            background: var(--bg-surface);
            color: var(--text-primary);
            transition: border-color 0.15s;
        }

        textarea {
            resize: vertical;
            line-height: 1.55;
            font-size: 14px;
        }

        input::placeholder, textarea::placeholder { color: var(--text-faint); }

        input:focus, textarea:focus {
            outline: none;
            border-color: var(--action);
        }

        .btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            font-family: inherit;
            font-size: 14px;
            font-weight: 600;
            padding: 10px 18px;
            border: 1px solid transparent;
            border-radius: var(--radius-sm);
            cursor: pointer;
            text-decoration: none;
            text-align: center;
            min-height: 40px;
            transition: background 0.15s, border-color 0.15s, color 0.15s;
            letter-spacing: -0.005em;
        }

        .btn-primary {
            background: var(--action);
            color: var(--on-action);
        }
        .btn-primary:hover { background: var(--action-hover); color: var(--on-action); }
        .btn-primary:disabled {
            background: var(--bg-surface-hover);
            color: var(--text-faint);
            cursor: not-allowed;
        }

        .btn-primary:focus-visible, .btn-secondary:focus-visible, .btn-danger:focus-visible {
            outline: 2px solid var(--action);
            outline-offset: 2px;
        }

        .btn-danger {
            background: var(--bg-surface);
            color: var(--danger);
            border-color: var(--danger-border);
            padding: 6px 12px;
            font-size: 13px;
            min-height: 32px;
        }
        .btn-danger:hover {
            background: var(--danger-bg);
            border-color: var(--danger);
        }

        .btn-secondary {
            background: var(--bg-surface);
            color: var(--text-secondary);
            border-color: var(--border);
            padding: 6px 12px;
            font-size: 13px;
            min-height: 32px;
        }
        .btn-secondary:hover {
            background: var(--bg-surface-hover);
            border-color: var(--border-strong);
            color: var(--text-primary);
        }

        .btn-full {
            display: flex;
            width: 100%;
        }

        .banner {
            padding: 12px 16px;
            border-radius: var(--radius-sm);
            margin-bottom: 16px;
            font-size: 14px;
            border: 1px solid;
            display: flex;
            align-items: flex-start;
            gap: 10px;
        }

        .banner::before {
            content: '';
            width: 6px;
            height: 6px;
            border-radius: 50%;
            margin-top: 8px;
            flex-shrink: 0;
        }

        .banner-warning {
            background: var(--warning-bg);
            border-color: var(--warning-border);
            color: var(--warning-text);
        }
        .banner-warning::before { background: var(--warning); }

        .banner-success {
            background: var(--positive-bg);
            border-color: var(--positive-border);
            color: var(--positive-text);
        }
        .banner-success::before { background: var(--positive); }

        .banner-error {
            background: var(--danger-bg);
            border-color: var(--danger-border);
            color: var(--danger-text);
        }
        .banner-error::before { background: var(--danger); }

        .banner a {
            color: inherit;
            font-weight: 600;
            text-decoration: underline;
        }

        .field-group { margin-bottom: 16px; }
        .field-row { display: flex; gap: 8px; align-items: start; }
        .field-row .field-grow { flex: 1; }

        .help-text {
            font-size: 13px;
            color: var(--text-muted);
            margin-bottom: 12px;
            line-height: 1.5;
        }

        .spinner {
            display: inline-block;
            width: 18px; height: 18px;
            border: 2.5px solid var(--border);
            border-top-color: var(--action);
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            vertical-align: middle;
            margin-right: 8px;
        }
        @keyframes spin { to { transform: rotate(360deg); } }

        .exp-header {
            background: var(--bg-surface-hover);
            border: 1px solid var(--border);
            padding: 10px 14px;
            border-radius: var(--radius-sm);
            margin-bottom: 10px;
        }
        .exp-header .company {
            font-weight: 600;
            color: var(--text-primary);
            letter-spacing: -0.01em;
        }
        .exp-header .role {
            font-weight: 500;
            color: var(--text-secondary);
            font-size: 14px;
        }
        .exp-header .meta {
            font-family: var(--font-mono);
            font-feature-settings: 'tnum';
            font-size: 12px;
            color: var(--text-muted);
            margin-top: 2px;
        }

        .bullet-row { display: flex; gap: 8px; align-items: start; margin-bottom: 6px; }
        .bullet-row textarea { margin-bottom: 0; }
        .bullet-row .btn-danger { flex-shrink: 0; align-self: center; }

        /* ─── Ledger rows (setup checklist, drafts list) ─── */
        .ledger { border-top: 1px solid var(--border); margin-bottom: 24px; }
        .ledger-row {
            display: flex;
            align-items: baseline;
            gap: 16px;
            padding: 12px 0;
            border-bottom: 1px solid var(--border);
            text-decoration: none;
            color: var(--text-primary);
        }
        a.ledger-row:hover { background: var(--bg-surface-hover); }
        .ledger-row .ledger-key {
            font-family: var(--font-mono);
            font-size: 12px;
            color: var(--text-muted);
            width: 24px;
            flex-shrink: 0;
        }
        .ledger-row .ledger-main { flex: 1; min-width: 0; }
        .ledger-row .ledger-title {
            display: block;
            font-weight: 500;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }
        .ledger-row .ledger-sub { display: block; font-size: 13px; color: var(--text-muted); }
        .ledger-row .ledger-meta {
            font-family: var(--font-mono);
            font-feature-settings: 'tnum';
            font-size: 12px;
            color: var(--text-muted);
            flex-shrink: 0;
        }
        .status-done { color: var(--positive-text); font-weight: 600; font-size: 13px; }
        .status-todo { color: var(--warning-text); font-weight: 600; font-size: 13px; }
        .muted { color: var(--text-muted); }

        @media (max-width: 600px) {
            .topbar-inner { padding: 0 20px; gap: 8px; }
            .nav-links a { padding: 6px 8px; font-size: 12px; }
            main { padding: 28px 20px 64px; }
            h1 { font-size: 24px; }
            .card { padding: 18px; }
        }
    </style>
    {% block extra_head %}{% endblock %}
</head>
<body>
    <header class="topbar">
        <div class="topbar-inner">
            <a href="https://norangio.dev" class="brand-mark" title="norangio.dev">N</a>
            <a href="https://norangio.dev" class="brand-name">norangio</a>
            <span class="brand-slash">/</span>
            <span class="brand-app">resume</span>
            <nav class="nav-links">
                <a href="/generate" {% if active_page == 'generate' %}class="active"{% endif %}>Generate</a>
                <a href="/setup" {% if active_page == 'setup' %}class="active"{% endif %}>My Docs</a>
                <a href="/profile" {% if active_page == 'profile' %}class="active"{% endif %}>Profile</a>
            </nav>
        </div>
    </header>
    <main>
        {% if flash_message %}
        <div class="banner banner-{{ flash_type or 'success' }}">{{ flash_message }}</div>
        {% endif %}
        {% block content %}{% endblock %}
    </main>
</body>
</html>
